name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/meierlabs-seo

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Check prettier
        run: npm run check-fmt

      - name: Check errors
        run: npm run check
